services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_assistant
    ports:
      # Bound to localhost only; see docs/security.md.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
